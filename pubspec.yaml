name: flutter_mvvm_riverpod
description: Flutter MVVM Riverpod template with auth, feature flags, and FCM
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"
  flutter: ">=3.41.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  json_serializable: ^6.13.1
  # dart_code_metrics: ^5.7.6 # discontinued

flutter:
  uses-material-design: true
