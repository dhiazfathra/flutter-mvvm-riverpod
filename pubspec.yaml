name: flutter_mvvm_riverpod
description: Flutter MVVM Riverpod template with auth, feature flags, and FCM
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  # dart_code_metrics: ^5.7.6

flutter:
  uses-material-design: true
